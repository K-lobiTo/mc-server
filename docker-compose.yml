services:
  minecraft:
    image: itzg/minecraft-server
    container_name: mc-server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      MEMORY: "5G"
      VERSION: "26.2"
      TYPE: "NEOFORGE"
      NEOFORGE_VERSION: "26.2.0.49"
    volumes:
      - ./mc-data:/data
    restart: unless-stopped
    stdin_open: true
    tty: true

  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    container_name: playit-agent
    network_mode: host
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_KEY}
    restart: unless-stopped
    depends_on:
      - minecraft

